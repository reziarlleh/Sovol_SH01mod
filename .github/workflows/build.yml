name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache ARM compiler archive
        uses: actions/cache@v4
        with:
          path: downloads/arm-gnu-toolchain-15.3.rel1-mingw-w64-i686-arm-none-eabi.zip
          key: arm-gcc-15.3.rel1-f1941b026f7a5383
      - name: Prepare pinned ARM compiler
        run: .\tools\fetch_tools.ps1
      - name: Build firmware
        run: .\tools\build.ps1
      - name: Cache native compiler archive
        uses: actions/cache@v4
        with:
          path: .tools/host/llvm-mingw-20261020-ucrt-x86_64.zip
          key: llvm-mingw-windows-fd5462b7f5d93b2ff981fcd3f9c7e427
      - name: Prepare pinned C test compiler
        run: .\tools\prepare_host_tests.ps1
      - name: Run seven C suites including dual sensors and resume
        run: .\tools\test.ps1
      - name: Audit ARM artifacts
        run: python .\tools\audit.py
      - name: Verify reproducible HEX and BIN
        run: |
          $expected = @{
            'bin' = 'b9f9d09829c6bb35cbab229f2f5f87ed3599081a18068e99109cf3d3a3cdf950'
            'hex' = '308cc66a4fcd3db9ceccbdb61cbe9e57e929122945e3c1eeece5567f0f378fd3'
          }
          foreach ($ext in $expected.Keys) {
            $path = "build/v1.3.0/sovol_sh01mod_v1_3_0.$ext"
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$ext]) {
              throw "Application SHA256 mismatch: $path"
            }
          }
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sovol-sh01mod-1.3.0
          if-no-files-found: error
          retention-days: 30
          path: |
            build/v1.3.0/*.hex
            build/v1.3.0/*.bin
            build/v1.3.0/*.elf
            build/v1.3.0/*.map
            build/v1.3.0/*.audit.json
