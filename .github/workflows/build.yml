name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache ARM compiler archive
        uses: actions/cache@v4
        with:
          path: downloads/arm-gnu-toolchain-15.3.rel1-mingw-w64-i686-arm-none-eabi.zip
          key: arm-gcc-15.3.rel1-f1941b026f7a5383
      - name: Prepare pinned ARM compiler
        run: .\tools\fetch_tools.ps1
      - name: Build firmware
        run: .\tools\build.ps1
      - name: Cache native compiler archive
        uses: actions/cache@v4
        with:
          path: .tools/host/llvm-mingw-20261020-ucrt-x86_64.zip
          key: llvm-mingw-windows-fd5462b7f5d93b2ff981fcd3f9c7e427
      - name: Prepare pinned C test compiler
        run: .\tools\prepare_host_tests.ps1
      - name: Run nine C suites including blocking sensor timing
        run: .\tools\test.ps1
      - name: Verify offline readback utilities
        run: python -m unittest discover -s tests -p test_readback_tools.py
      - name: Audit ARM artifacts
        run: python .\tools\audit.py
      - name: Verify reproducible HEX and BIN
        run: |
          $expected = @{
            'bin' = 'a22a52d7b366ab2724326caa1660fd2c217e9303edd8d8d4c7948514b2121076'
            'hex' = '771dc3cffa9c735510f8c950fa6ca2a2d015a00c8e46d5c70da2d89e6395bb7f'
          }
          foreach ($ext in $expected.Keys) {
            $path = "build/v1.5.0/sovol_sh01mod_v1_5_0.$ext"
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$ext]) {
              throw "Application SHA256 mismatch: $path"
            }
          }
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sovol-sh01mod-1.5.0
          if-no-files-found: error
          retention-days: 30
          path: |
            build/v1.5.0/*.hex
            build/v1.5.0/*.bin
            build/v1.5.0/*.elf
            build/v1.5.0/*.map
            build/v1.5.0/*.audit.json
