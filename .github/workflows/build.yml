name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out sources
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Cache ARM compiler archive
        uses: actions/cache@v4
        with:
          path: downloads/arm-gnu-toolchain-15.3.rel1-mingw-w64-i686-arm-none-eabi.zip
          key: arm-gcc-15.3.rel1-f1941b026f7a5383
      - name: Prepare pinned ARM compiler
        run: .\tools\fetch_tools.ps1
      - name: Build firmware
        run: .\tools\build.ps1
      - name: Cache native compiler archive
        uses: actions/cache@v4
        with:
          path: .tools/host/llvm-mingw-20261020-ucrt-x86_64.zip
          key: llvm-mingw-windows-fd5462b7f5d93b2ff981fcd3f9c7e427
      - name: Prepare pinned C test compiler
        run: .\tools\prepare_host_tests.ps1
      - name: Run nine C suites including blocking sensor timing
        run: .\tools\test.ps1
      - name: Audit ARM artifacts
        run: python .\tools\audit.py
      - name: Verify reproducible HEX and BIN
        run: |
          $expected = @{
            'bin' = '9a6f67f99a00773451a31d377c53ad36329db38cace8799ef14dea3c62506371'
            'hex' = '77019ad3efce3515f822af2706befc9af3549e24de5d9c1e6a3a0d2441423a31'
          }
          foreach ($ext in $expected.Keys) {
            $path = "build/v1.4.0/sovol_sh01mod_v1_4_0.$ext"
            if ((Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash -ne $expected[$ext]) {
              throw "Application SHA256 mismatch: $path"
            }
          }
      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: sovol-sh01mod-1.4.0
          if-no-files-found: error
          retention-days: 30
          path: |
            build/v1.4.0/*.hex
            build/v1.4.0/*.bin
            build/v1.4.0/*.elf
            build/v1.4.0/*.map
            build/v1.4.0/*.audit.json
